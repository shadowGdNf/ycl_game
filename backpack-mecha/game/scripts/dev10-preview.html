<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dev.10 · 背包与战斗验收</title>
<style>body{margin:0;padding:24px;background:#11252c;color:#e8e8d7;font:15px system-ui;line-height:1.6}main{max-width:1180px;margin:auto}h1{margin:0}p{color:#b5ccc9}button{padding:12px 18px;margin:5px;background:#f5bb74;color:#172b30;font:inherit;border:0;border-radius:6px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:24px 0}article{background:#213940;border:1px solid #456269;border-radius:10px;overflow:hidden;text-align:center}canvas{width:100%;height:250px;display:block}article h2{font-size:17px;margin:10px 0 0}article p{font-size:13px;margin:4px 10px 16px}#motion canvas{height:460px;max-width:800px;margin:auto}pre{white-space:pre-wrap;color:#88e4c1}small{color:#f4c886}</style><main><small>FIELD TEST / 010 · 本地验收</small><h1>更自由的装配，更有层次的战斗</h1><p>这个独立端口使用测试存档，与正常试玩和线上进度隔离。</p><button id="seed">装入失效配件场景并打开游戏</button><button id="pause">暂停动作</button><button id="reduce">减少动态：关</button><p id="status"></p><div class="grid" id="units"></div><article id="motion"><h2>玩家动作 · 移动 / 冲刺 / 武器后坐</h2><canvas id="player"></canvas></article><pre id="metrics">加载中…</pre></main>
<script type="module">
import {newRun,autoPack} from '/game/js/economy.js';
import {freshProfile,saveGame} from '/game/js/storage.js';
import {createBattle,spawnEnemy,stepBattle} from '/game/js/combat.js';
import {motionFrame} from '/game/js/motion.js';
import {enemyBody} from '/game/js/motion-renderer.js';
import {locomotion} from '/game/js/visual-motion.js';
import {Art} from '/game/js/art.js';
import {Renderer} from '/game/js/renderer.js';
import {ENEMY_BY_ID} from '/game/js/content.js';
const idle={x:0,y:0,dash:false,overload:false},art=new Art();await art.load();let paused=false,reduced=false,frames=0,renderMs=[];
const units=['E13','E14','E15','E16'].map(id=>{const d=ENEMY_BY_ID[id],card=document.createElement('article');card.innerHTML=`<h2>${d.name}</h2><canvas width="400" height="300"></canvas><p>${({E13:'侧翼接近 → 蓄力 → 短距突进',E14:'锁定瞄准 → 炮管后坐 → 恢复',E15:'双侧布雷 → 炮仓伸缩 → 封路',E16:'环架旋转 → 能量充盈 → 环形弹幕'})[id]}</p>`;document.querySelector('#units').append(card);return {id,canvas:card.querySelector('canvas'),...scene(id),gait:undefined};});
function scene(id){const run=newRun('scavenger','full',0,'ANIMATION');run.wave=7;run.items=[];const w=createBattle(run);w.obstacles=[];w.encounter.nextSpawn=10000;w.player.invulnerable=10000;return {w,e:spawnEnemy(w,{id,x:560,y:650,elite:false,affix:0,reward:false,cost:0})};}
const r=newRun('scavenger','full',0,'PLAYER-MOTION');r.wave=7;r.power=24;r.unlockedCorners=[0,1,2,3];r.items.push({uid:'shotgun',id:'W02',tier:2,x:0,y:0,rotation:0,stored:false});autoPack(r);let pw=createBattle(r);pw.obstacles=[];pw.encounter.nextSpawn=10000;pw.player.invulnerable=10000;const enemy=spawnEnemy(pw,{id:'E03',x:1030,y:630,elite:false,affix:0,reward:false,cost:0});enemy.hp=enemy.maxHp=100000;enemy.speed=0;enemy.damage=0;const renderer=new Renderer(document.querySelector('#player'));await renderer.load();
document.querySelector('#seed').onclick=async()=>{const run=newRun('scavenger','full',0,'DEV10-UI');run.wave=9;run.gold=600;run.power=18;run.unlockedCorners=[0,1,2,3];for(const id of ['S05','S10','S02'])run.items.push({uid:id,id,tier:2,x:0,y:0,rotation:0,stored:false});autoPack(run);run.shop=[{id:'W01',tier:1,locked:false},{id:'W03',tier:2,locked:false},{id:'S07',tier:3,locked:false},{id:'U02',tier:4,locked:false}];const profile=freshProfile();profile.tutorial=true;profile.settings.unlockAll=true;if(await saveGame({version:1,profile,run,battle:null,savedAt:Date.now()}))location.href='/game/';else document.querySelector('#status').textContent='测试存档写入失败';};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续动作':'暂停动作';};document.querySelector('#reduce').onclick=e=>{reduced=!reduced;e.target.textContent=`减少动态：${reduced?'开':'关'}`;};
let last=performance.now();function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;const start=performance.now();
 for(const unit of units){if(!paused){stepBattle(unit.w,idle,dt);unit.gait=locomotion(unit.gait,unit.e,dt);if(unit.w.time>6)Object.assign(unit,scene(unit.id),{gait:undefined});}const motion=motionFrame(unit.w).get(unit.e.eid),c=unit.canvas.getContext('2d');c.clearRect(0,0,400,300);c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(200,230,90,20,0,0,Math.PI*2);c.fill();enemyBody(c,art,unit.id,{...unit.e,x:200,y:170},motion,200,unit.w.time,reduced,unit.gait);}
 if(!paused){const a=pw.time*.8;stepBattle(pw,{x:Math.cos(a),y:Math.sin(a),dash:pw.time%5<.03,overload:false},dt);if(pw.time>35){pw.time=0;pw.player.x=800;pw.player.y=650;}}renderer.draw(pw,{lang:'zh',reducedMotion:reduced,colorAssist:false});renderMs.push(performance.now()-start);if(renderMs.length>600)renderMs.shift();frames++;if(frames%30===0){const sorted=[...renderMs].sort((a,b)=>a-b);document.querySelector('#metrics').textContent=JSON.stringify({frames,paused,reduced,renderP95ms:Number(sorted[Math.floor(sorted.length*.95)].toFixed(2)),units:units.map(u=>({id:u.id,stage:motionFrame(u.w).get(u.e.eid).stage}))},null,2);}requestAnimationFrame(frame);};requestAnimationFrame(frame);
</script></html>
