<!doctype html>
<html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>背包机甲 · 战斗反馈验收</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100dvh;background:#111e26;color:#e8dfc9;font:14px system-ui;display:flex;flex-direction:column}header{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #49606a}strong{color:#f3c487}button,select{font:inherit;padding:8px 12px;color:inherit;background:#263b44;border:1px solid #5a747b;border-radius:5px}select{max-width:100%}button:hover{background:#35535d}canvas{display:block;width:100%;flex:1;min-height:0}footer{padding:10px 16px;font:12px monospace;white-space:pre-wrap;border-top:1px solid #49606a}label{white-space:nowrap}small{color:#a7bdc5}#report{max-height:110px;overflow:auto;margin:0;padding:0 16px;background:#162a34;font:11px monospace}
</style>
<header><strong>战斗反馈 · 开发场景</strong><select id="scene" aria-label="验证场景"><option value="crane">起重机 · 完整循环</option><option value="sweep">起重机 · 摆锤命中</option><option value="ballistic">铆钉 / 霰弹 / 穿甲</option><option value="element">水弹 / 电链 / 冰晶</option><option value="flame">火焰 / 燃油 / 导弹</option><option value="melee">重锤 / 圆锯 / 无人机</option><option value="dense">第三章 · 密集战斗</option><option value="B1A">压路王</option><option value="B2A">熔炉蟹</option><option value="B2B">磁轨双子</option><option value="B3A">回收者</option><option value="B3B">回收母舰</option></select><button id="play">播放</button><button id="step">推进 0.5 秒</button><button id="tick">推进 1 帧</button><button id="reset">重置</button><label><input id="reduced" type="checkbox">减少动态</label><label><input id="assist" type="checkbox">色彩辅助</label><label><input id="sound" type="checkbox">声音</label><button id="benchmark">采样 10 秒</button><small>WASD 移动 · 空格冲刺 · E 超载 · 不写入存档</small></header>
<canvas id="view"></canvas><footer id="status"></footer><pre id="report"></pre>
<script type="module">
const base=new URLSearchParams(location.search).has('baseline')?'/baseline':'/game';
const [{Renderer},{newRun},{createBattle,spawnEnemy,stepBattle},{GameAudio},{freshProfile},{BUILD_VERSION,RULESET_VERSION}]=await Promise.all(['renderer','economy','combat','audio','storage','version'].map(name=>import(`${base}/js/${name}.js`)));
const canvas=document.querySelector('canvas'),select=document.querySelector('#scene'),renderer=new Renderer(canvas),status=document.querySelector('#status'),report=document.querySelector('#report');
await renderer.load();const profile=freshProfile();profile.settings.music=false;const audio=new GameAudio(profile.settings);
let w,playing=false,previous=0,samples=null;const keys=new Set(),options={lang:'zh',reducedMotion:false,colorAssist:false};
function reset(){
 const id=select.value,run=newRun('scavenger','full',0,'FEEDBACK-DEVELOPMENT-FIXTURE');
 const weapons={crane:['W01'],sweep:[],ballistic:['W01','W02','W07'],element:['W03','W04','W12'],flame:['W05','W06','W10'],melee:['W08','W09','W11'],dense:['W03','W04','W10']}[id]??['W01'];
 run.items=weapons.map((id,i)=>({id,uid:`fixture-${i}`,tier:1,x:i*2,y:1,rotation:0,stored:false}));
 const boss=id==='crane'||id==='sweep'?'B1B':id.startsWith('B')?id:null;run.wave=boss?Number(boss[1])*4:11;if(boss)run.bosses[Number(boss[1])-1]=boss;
 w=createBattle(run);w.obstacles=[];w.encounter.budget=0;w.encounter.nextSpawn=10000;
 if(id==='sweep'){w.bossClock=0;w.bossTurn=1;w.player.x=1000;w.player.y=300;w.player.shield=5;w.lastDamage=0;}
 if(id==='dense')w.player.hp=w.player.maxHp=10000; // Sustained render fixture; never a natural run.
 if(!boss){for(let i=0;i<(id==='dense'?40:10);i++){const angle=i*Math.PI*2/10,r=id==='melee'?80:id==='flame'?100:180+i%3*25;
   const e=spawnEnemy(w,{id:id==='dense'?`E${String(i%12+1).padStart(2,'0')}`:'E03',x:800+Math.cos(angle)*r,y:650+Math.sin(angle)*r,elite:i%7===0,affix:0,reward:false,cost:0});e.hp=e.maxHp=500;e.speed=20;}
 }
 playing=false;samples=null;keys.clear();previous=0;audio.resetEvents();document.querySelector('#play').textContent='播放';report.textContent='';
}
function input(){return {x:Number(keys.has('d'))-Number(keys.has('a')),y:Number(keys.has('s'))-Number(keys.has('w')),dash:keys.has(' '),overload:keys.has('e')};}
select.onchange=reset;document.querySelector('#reset').onclick=reset;
document.querySelector('#play').onclick=()=>{audio.unlock();playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放';};
document.querySelector('#step').onclick=()=>{stepBattle(w,input(),.5);if(document.querySelector('#sound').checked){audio.unlock();audio.consume(w.events);}};
document.querySelector('#tick').onclick=()=>stepBattle(w,input(),1/60);
document.querySelector('#reduced').onchange=e=>options.reducedMotion=e.target.checked;document.querySelector('#assist').onchange=e=>options.colorAssist=e.target.checked;
document.querySelector('#sound').onchange=e=>{audio.unlock();audio.configure({...profile.settings,sound:e.target.checked});};
document.addEventListener('keydown',e=>{if(['w','a','s','d',' ','e'].includes(e.key.toLowerCase())&&!['SELECT','INPUT','BUTTON'].includes(document.activeElement?.tagName)){e.preventDefault();keys.add(e.key.toLowerCase());}});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;keys.clear();document.querySelector('#play').textContent='播放';if(samples)samples.hidden=true;}});
document.querySelector('#benchmark').onclick=()=>{samples={start:performance.now(),battleStart:w.time,last:0,frames:[],render:[],hidden:document.hidden};playing=true;document.querySelector('#play').textContent='暂停';};
reset();
function frame(now){
 const dt=previous?Math.min(.05,(now-previous)/1000):0;previous=now;
 if(playing){stepBattle(w,input(),dt);if(document.querySelector('#sound').checked)audio.consume(w.events);}
 const start=performance.now();renderer.draw(w,options);const elapsed=performance.now()-start;
 status.textContent=`${BUILD_VERSION} / 规则 ${RULESET_VERSION} · ${base==='/baseline'?'原版':'当前版'} · ${playing?'播放':'暂停'} · ${w.time.toFixed(2)}s · HP ${w.player.hp.toFixed(1)} · 护盾 ${w.player.shield.toFixed(1)} · 承伤 ${w.stats.damageTaken.toFixed(1)} · 输出 ${Object.values(w.stats.damageByModule).reduce((a,b)=>a+b,0).toFixed(1)}\n开发夹具；装备与敌人由场景设置${select.value==='dense'?'，密集场景为 10000 HP 持续渲染夹具':''}；不计作自然通关或真人试玩。`;
 if(samples){if(now-samples.start>1000){if(samples.last)samples.frames.push(now-samples.last);samples.render.push(elapsed);}samples.last=now;
  if(now-samples.start>11000){const summary=values=>{const s=values.toSorted((a,b)=>a-b);return {samples:s.length,p50:s[Math.ceil(s.length*.5)-1],p95:s[Math.ceil(s.length*.95)-1],max:s.at(-1),over50Pct:100*s.filter(v=>v>50).length/s.length};};
   report.textContent=JSON.stringify({build:BUILD_VERSION,rules:RULESET_VERSION,scene:select.value,recordedAt:new Date().toISOString(),userAgent:navigator.userAgent,dpr:devicePixelRatio,viewport:[innerWidth,innerHeight],canvas:[canvas.width,canvas.height],reducedMotion:options.reducedMotion,foreground:!samples.hidden,warmupMs:1000,durationMs:now-samples.start-1000,battleSeconds:w.time-samples.battleStart,battleStatus:w.status,remainingEnemies:w.enemies.length,playerMaxHp:w.player.maxHp,interval:summary(samples.frames),render:summary(samples.render),raw:{intervalMs:samples.frames,renderMs:samples.render}});samples=null;playing=false;document.querySelector('#play').textContent='播放';
  }
 }
 requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
